name: Project CI

on:
  push:
    branches:
      - main
      - 'tuan-*'
  pull_request:
    branches:
      - main

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: testcase_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d testcase_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/testcase_ai_test
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      OPENAI_API_KEY: ci-test-openai-key
      CELERY_BROKER_URL: amqp://guest:guest@127.0.0.1:5672//
      FRONTEND_ORIGIN: http://localhost:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: src/backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/backend/requirements.txt

      - name: Run database migrations
        run: python -m alembic -c src/backend/alembic.ini upgrade head

      - name: Compile Python source
        run: python -m compileall -q src/backend/app

      - name: Ruff check
        run: python -m ruff check src/backend

      - name: Ruff format check
        run: python -m ruff format --check src/backend

      - name: Backend tests
        run: python -m pytest

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8001/api/v1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Prettier check
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Next.js build
        run: npm run build
