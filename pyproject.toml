[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"] # pytest uses assert by design

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["src/backend/tests"]
pythonpath = ["src/backend"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/backend/app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff.lint.per-file-ignores]
"src/backend/tests/**/*.py" = ["S105", "S106"] # Test-only fake passwords are not secrets.
